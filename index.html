    <!-- 
==================================================
              دليل مفاهيم Git و GitHub
==================================================

* ملحوظة من الدهب: 
  الـ Git ده شغال لوكال (Local) على جهازك مش محتاج نت، 
  أما الـ GitHub ده موقع على الإنترنت (Online/Cloud) بنرفع عليه شغلنا.

1. Version Control System (VCS):
   ده النظام العام اللي بيراقب ويسجل أي تعديل بيحصل في ملفات مشروعك أول بأول،
   عشان لو الكود باظ في أي وقت تعرف ترجع لنسخة زمان بضغطة زرار من غير وجع دماغ.

2. Repository (Repo):
   ده الفولدر أو المخزن بتاع المشروع، بيكون جواه كل الملفات والأكواد، 
   وفوقيهم سجل تاريخي كامل بيعرفك مين عدل إيه والساعة كام من أول يوم شغل.

3. Commit:
   دي زي حركة سيف (Save) أو لقطة للشاشة للكود بتاعك في لحظة معينة بعد ما تخلص شغل، 
   وبتكتب معاها رسالة سريعة تفهمك وتفهم غيرك إنت عدلت إيه بالظبط.

4. Version Control:
   دي عملية إدارة ومتابعة النسخ نفسها؛ يعني تقارن كود النهارده بكود إمبارح، 
   وتمنع التعديلات إنها تدخل في بعضها لو كذا واحد شغال في نفس الفايل.

5. Remote Repository (GitHub):
   دي النسخة المرفوعة أونلاين على الإنترنت (زي جيت هب)، 
   عشان تبقى معاك نسخة احتياطية على السحابة، وتعرف تشارك الكود مع تيمك أو تعرضه للناس من أي مكان في العالم.
==================================================
